<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - Lưu Trữ Đám Mây</title>
    <link rel="stylesheet" href="style.css">
    <style>
    </style>
</head>
<body>

    <!-- Header điều hướng -->
    <header class="site-header">
        <div class="container header-container">
            <div class="header-actions">
                <!-- Nút chuyển đổi Dark/Light Mode -->
                <button type="button" id="theme-toggle" class="btn-icon" aria-label="Đổi giao diện">
                    <span id="theme-icon">🌙</span>
                </button>
                <a href="index.html" class="btn-secondary">Trở về trang chủ</a>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <!-- Navigation Tabs -->
            <div class="auth-tabs">
                <button type="button" class="tab-btn active" onclick="switchTab('login')">Đăng Nhập</button>
                <button type="button" class="tab-btn" onclick="switchTab('register')">Tạo Tài Khoản</button>
            </div>

            <!-- Form Đăng Nhập -->
            <form id="login-form" class="auth-form active" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Mật khẩu</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="form-options">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox"> Ghi nhớ đăng nhập
                    </label>
                    <a href="#">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn-primary btn-submit">Đăng Nhập</button>
            </form>

            <!-- Form Đăng Ký -->
            <form id="register-form" class="auth-form" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="reg-name">Họ và tên</label>
                    <input type="text" id="reg-name" class="form-input" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Mật khẩu</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="Tối thiểu 8 ký tự" required>
                </div>
                <div class="form-group">
                    <label for="reg-confirm-password">Xác nhận mật khẩu</label>
                    <input type="password" id="reg-confirm-password" class="form-input" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="btn-primary btn-submit">Tạo Tài Khoản Miễn Phí</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container footer-container">
            <p>&copy; 2026 Nền Tảng Lưu Trữ. Bảo lưu mọi quyền.</p>
        </div>
    </footer>

    <!-- Script Chuyển Tab & Đồng bộ Dark Mode -->
    <script>
        // Chuyển đổi giữa Đăng Nhập / Đăng Ký
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabs = document.querySelectorAll('.tab-btn');

            if (tab === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
                tabs[1].classList.add('active');
                tabs[0].classList.remove('active');
            }
        }

        // Xử lý Dark / Light Mode
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeIcon.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
                themeIcon.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                themeIcon.textContent = '☀️';
            }
        });
    </script>
</body>
</html>
